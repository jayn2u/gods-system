name: Sync validated submodule pointers

on:
  repository_dispatch:
    types:
      - submodule-develop-updated

permissions:
  contents: read

concurrency:
  group: submodule-pointer-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out gods-system develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Create source read token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SUBMODULE_SYNC_APP_ID }}
          private-key: ${{ secrets.SUBMODULE_SYNC_APP_PRIVATE_KEY }}
          owner: jayn2u
          repositories: |
            gods-eye
            gods-mlops
            gods-watching
          permission-contents: read

      - name: Create gods-system write token
        id: push-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SUBMODULE_SYNC_APP_ID }}
          private-key: ${{ secrets.SUBMODULE_SYNC_APP_PRIVATE_KEY }}
          owner: jayn2u
          repositories: gods-system
          permission-contents: write

      - name: Validate and sync submodule pointers
        env:
          SUBMODULE_SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
          SUPERPROJECT_PUSH_TOKEN: ${{ steps.push-token.outputs.token }}
        run: >-
          python3 scripts/sync_submodules.py
          --event-path "$GITHUB_EVENT_PATH"
          --repository "$GITHUB_WORKSPACE"
