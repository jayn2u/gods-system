name: Repository Python tests

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/sync-submodules.yml
      - scripts/sync_submodules.py
      - tests/test_sync_submodules.py
      - scripts/ansible_auth.py
      - tests/test_ansible_auth.py
      - docs/ansible-vault-authentication.md
  push:
    branches:
      - develop
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/sync-submodules.yml
      - scripts/sync_submodules.py
      - tests/test_sync_submodules.py
      - scripts/ansible_auth.py
      - tests/test_ansible_auth.py
      - docs/ansible-vault-authentication.md

permissions:
  contents: read

jobs:
  sync-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Ansible Core
        run: python3 -m pip install ansible-core==2.16.3

      - name: Run repository tests
        run: python3 -m unittest discover -s tests -v
